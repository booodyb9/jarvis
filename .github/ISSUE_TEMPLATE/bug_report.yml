name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please remove API keys and personal details before posting.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you say or do, what did you expect, and what happened instead?
      placeholder: 'I said "Hey Jarvis, open YouTube". It replied "Sorry, I didn''t catch that."'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Turn Jarvis on
        2. Say "Hey Jarvis…"
        3. …
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Samsung Galaxy S23, Android 14
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Jarvis version
      description: The release you installed
      placeholder: 0.1.0
  - type: input
    id: model
    attributes:
      label: AI provider and model
      placeholder: Claude, claude-opus-5-5
  - type: textarea
    id: crash
    attributes:
      label: Crash report or logs
      description: If the app crashed, tap "Share report" on the Home screen and paste it here.
      render: text
