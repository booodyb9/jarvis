name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: bash ./gradlew testDebugUnitTest

      - name: Build signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          JARVIS_KEYSTORE="$RUNNER_TEMP/release.jks" bash ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Jarvis-${GITHUB_REF_NAME}.apk"

      - name: Build debug APK (no signing key configured)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          bash ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "Jarvis-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Jarvis-${GITHUB_REF_NAME}.apk" --title "Jarvis $GITHUB_REF_NAME" --generate-notes

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
