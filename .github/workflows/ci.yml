name: CI

on:
  push:
    branches: [main, master, 'feature/arabic-floating-assistant']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache sherpa-onnx
        uses: actions/cache@v4
        with:
          path: app/libs/*.aar
          key: sherpa-onnx-${{ hashFiles('app/build.gradle.kts') }}

      - name: Unit tests and lint
        run: bash gradlew testDebugUnitTest lintDebug

      - name: Build APK
        run: bash gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mosaedak-arabic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
